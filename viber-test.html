<!doctype html>
<!-- Viber link-format test page (2026-10-09): viber-test.html#6281234567890 shows one button per link format, to find
     which one opens the chat on this phone. The number stays after '#' (never sent to the host). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Viber link test</title>
<style>
  body { font-family: -apple-system, Segoe UI, Roboto, sans-serif; text-align: center; padding: 32px 16px; }
  a.btn { display: block; max-width: 360px; margin: 12px auto; padding: 14px; background: #7360f2; color: #fff;
          border-radius: 8px; text-decoration: none; font-size: 17px; }
  small { display: block; color: #555; margin-top: 4px; font-size: 12px; }
</style>
</head>
<body>
<p id="msg" style="font-size:18px">Viber link test</p>
<div id="list"></div>
<script>
  var n = (location.hash || '').replace(/\D/g, '');
  var list = document.getElementById('list');
  if (n.length < 8 || n.length > 15) {
    document.getElementById('msg').textContent = 'No valid number in this link.';
  } else {
    document.getElementById('msg').textContent = 'Testing +' + n + ': tap each one, then come back here';
    [['A', 'viber://chat?number=%2B' + n, 'chat, number with +'],
     ['B', 'viber://chat?number=' + n, 'chat, number without +'],
     ['C', 'viber://chat/?number=%2B' + n, 'chat, other spelling'],
     ['D', 'viber://add?number=' + n, 'opens "add contact" with the number filled in']
    ].forEach(function (x) {
      var a = document.createElement('a'); a.className = 'btn'; a.href = x[1];
      a.innerHTML = 'Option ' + x[0] + '<small>' + x[2] + '</small>'; list.appendChild(a);
    });
  }
</script>
</body>
</html>
